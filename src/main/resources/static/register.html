<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donor Registration | BloodConnect</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-danger">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">🩸 BloodConnect</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="index.html">Home</a>
            <a class="nav-link active" href="register.html">Register</a>
            <a class="nav-link" href="search.html">Find Donors</a>
        </div>
    </div>
</nav>

<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-8">

            <div class="card shadow p-4">
                <h2 class="text-center text-danger mb-4">Become a Blood Donor</h2>

                <form id="donorForm">

                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text" class="form-control" id="name" required>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Age</label>
                            <input type="number" class="form-control" id="age" min="18" required>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Gender</label>
                            <select class="form-select" id="gender" required>
                                <option value="">Select Gender</option>
                                <option>Male</option>
                                <option>Female</option>
                                <option>Other</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Mobile Number</label>
                        <input type="tel" class="form-control" id="mobile"
                               pattern="[0-9]{10}" maxlength="10" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Blood Group</label>
                        <select class="form-select" id="bloodGroup" required>
                            <option value="">Select Blood Group</option>
                            <option>A+</option>
                            <option>A-</option>
                            <option>B+</option>
                            <option>B-</option>
                            <option>AB+</option>
                            <option>AB-</option>
                            <option>O+</option>
                            <option>O-</option>
                        </select>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">City</label>
                            <input type="text" class="form-control" id="city" required>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">District</label>
                            <input type="text" class="form-control" id="district" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Last Donation Date</label>
                        <input type="date" class="form-control" id="lastDonationDate">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Donor Availability</label>
                        <select class="form-select" id="available" required>
                            <option value="true">Available</option>
                            <option value="false">Currently Unavailable</option>
                        </select>
                    </div>

                    <div class="form-check mb-3">
                        <input type="checkbox" class="form-check-input"
                               id="contactConsent" required>
                        <label class="form-check-label" for="contactConsent">
                            I agree to share my mobile number with people searching for blood donors.
                        </label>
                    </div>

                    <button type="submit" class="btn btn-danger w-100">
                        Register as Donor
                    </button>

                    <div id="message" class="mt-3 text-center"></div>

                </form>
            </div>

        </div>
    </div>
</div>

<script src="js/script.js"></script>

</body>
</html>
